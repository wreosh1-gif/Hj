<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Hero - كورس الإنجليزية</title>
    <style>
        /* ألوان مريحة للعين */
        :root { 
            --bg-color: #f0f4f8; /* أزرق رمادي فاتح جداً */
            --container-bg: #ffffff;
            --text-main: #2d3436;
            --accent-blue: #0088cc;
            --timer-color: #e74c3c;
            --border-color: #d1d8e0;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .box { 
            background: var(--container-bg); 
            padding: 40px 25px; 
            border-radius: 20px; 
            max-width: 450px; 
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        h2 { color: var(--accent-blue); margin-top: 0; font-size: 28px; }
        
        p { line-height: 1.6; color: #636e72; margin-bottom: 25px; }

        .timer-wrapper {
            background: #fdfdfd;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .timer { font-size: 20px; font-weight: bold; }
        #sec { color: var(--timer-color); font-size: 26px; }

        .btn { 
            display: none; 
            background: var(--accent-blue); 
            color: white; 
            text-decoration: none; 
            padding: 18px; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 19px; 
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 136, 204, 0.2);
        }

        .btn:hover { background: #0077b5; transform: translateY(-2px); }

        .ad-area { 
            background: #f9f9f9; 
            min-height: 100px; 
            margin: 20px 0; 
            border: 1px dashed #ccc; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 11px; 
            color: #b2bec3;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Zero Hero 🎓</h2>
    <p>أهلاً بك! نحن نجهز لك الآن رابط الدخول الحصري لكورس اللغة الإنجليزية على التلجرام.</p>

    <!-- مساحة إعلان Adsterra العلوي -->
    <div class="ad-area">
        <!-- ضع كود إعلانك هنا -->
        مساحة إعلانية (بانر)
    </div>

    <div id="timer-container" class="timer-wrapper">
        <div class="timer">يرجى الانتظار <span id="sec">15</span> ثانية...</div>
    </div>

    <!-- الرابط بصيغة تضمن فتح التطبيق مباشرة -->
    <a href="tg://resolve?domain=zeroheroiq" class="btn" id="go-btn">✅ دخول القناة الآن</a>

    <!-- مساحة إعلان Adsterra سفلي -->
    <div class="ad-area">
        <!-- ضع كود إعلانك هنا -->
        مساحة إعلانية (بانر)
    </div>

    <p style="font-size: 12px; margin-top: 15px;">
        تأكد من فتح الرابط في المتصفح الخارجي (Chrome أو Safari) لضمان التحويل التلقائي.
    </p>
</div>

<script>
    let timeLeft = 15;
    const secSpan = document.getElementById('sec');
    const timerBox = document.getElementById('timer-container');
    const btnLink = document.getElementById('go-btn');

    const interval = setInterval(() => {
        timeLeft--;
        secSpan.textContent = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(interval);
            timerBox.style.display = 'none';
            btnLink.style.display = 'block';
        }
    }, 1000);
</script>

</body>
</html>
