<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Hero - كورس اللغة الإنجليزية</title>
    <style>
        :root { --primary: #FFD700; --dark: #1a1a1a; --white: #ffffff; }
        body { background-color: var(--primary); color: var(--dark); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; text-align: center; }
        .container { width: 90%; max-width: 500px; background: var(--white); padding: 30px; margin: 40px 0; border-radius: 25px; box-shadow: 12px 12px 0px var(--dark); border: 3px solid var(--dark); }
        .logo { font-size: 35px; font-weight: bold; color: var(--dark); margin-bottom: 10px; border-bottom: 4px solid var(--primary); display: inline-block; }
        h1 { font-size: 24px; margin-bottom: 20px; color: #d32f2f; }
        p { font-size: 17px; line-height: 1.6; margin-bottom: 25px; }
        
        .timer-box { font-size: 18px; font-weight: bold; padding: 20px; background: #fff9c4; border: 2px dashed var(--dark); border-radius: 15px; margin-bottom: 20px; }
        #seconds { color: #d32f2f; font-size: 25px; }

        .btn { display: none; width: 100%; background: #0088cc; color: white; text-decoration: none; padding: 18px; border-radius: 12px; font-size: 20px; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,136,204,0.3); }
        .btn:hover { background: #0077b5; transform: translateY(-3px); }

        .ad-slot { margin: 20px 0; min-height: 100px; background: #f0f0f0; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #999; overflow: hidden; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Zero Hero 🎓</div>
    <h1>كورس اللغة الإنجليزية المجاني</h1>
    <p>أهلاً بك في كورس <b>Zero Hero</b>. سيتم تحويلك إلى قناة التلجرام الخاصة بالكورس بعد لحظات.. يرجى الانتظار لتجهيز الرابط.</p>

    <!-- مساحة إعلان Adsterra العلوي - ضروري جداً هنا -->
    <div class="ad-slot">
        <!-- ضع كود إعلان Adsterra هنا -->
        إعلان (بانر علوي)
    </div>

    <div class="timer-box" id="timer-container">
        انتظر <span id="seconds">15</span> ثانية للحصول على رابط القناة...
    </div>

    <!-- زر التلجرام الذي سيظهر بعد انتهاء الثواني -->
    <a href="https://t.me/zeroheroiq" class="btn" id="join-btn">✅ اضغط هنا للانضمام للقناة</a>

    <!-- مساحة إعلان Adsterra سفلي -->
    <div class="ad-space" style="margin-top: 20px;">
        <!-- ضع كود إعلان Adsterra هنا -->
        إعلان (بانر سفلي)
    </div>
</div>

<script>
    let timeLeft = 15; // عدد الثواني التي تريدها
    const secondsSpan = document.getElementById('seconds');
    const timerContainer = document.getElementById('timer-container');
    const joinBtn = document.getElementById('join-btn');

    const countdown = setInterval(() => {
        timeLeft--;
        secondsSpan.textContent = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerContainer.style.display = 'none'; // إخفاء العداد
            joinBtn.style.display = 'block'; // إظهار الزر
        }
    }, 1000);
</script>

</body>
</html>
